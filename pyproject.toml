[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF security scan and markdown conversion pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pdf-injection-scanner>=0.2.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
pdf2md = "pdf2md.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]

[tool.hatch.build.targets.wheel.force-include]
"src/pdf2md" = "pdf2md"

[tool.ruff]
line-length = 100
target-version = "py310"
